- name: PLAY-1
  hosts: localhost
  tasks:
  - name: PLAY-1 and TASK-1
    ansible.builtin.debug:
      msg: "Hello I am from PLAY-1 and TASK-1"
- name: PLAY-2
  hosts: localhost
  tasks:
  - name: PLAY-2 and TASK-1
    ansible.builtin.debug:   # debug is like echo command to print messages.
      msg: "Hello I am from PLAY-2 and TASK-1"

# Ansible recognizes that localhost means the machine where the playbook is being run (usually your laptop or control node) 
# and executes tasks locally, bypassing SSH. No SSH is required because the machine is already accessible locally
# master-node connecting is---localhost


