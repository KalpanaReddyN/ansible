- name: create ec2 instance
  hosts: localhost
  connection: local
  vars:
    vpc_sunet_id: "subnet-05f4df5d011925acd"
    sg_id: "sg-099a766437c0af022"
    image_id: "ami-09c813fb71547fc4f"
  instances:
  - mysql
  - backend
  - frontend
  zone: kalpanadevops.online
  tasks:
  - name: install botocore and boto3
    ansible.builtin.pip:
    name:
    - botocore
    - boto3
    executable: pip3.9

  - name: create ec2-instances
    amazon.aws.ec2_instance:
      name: "{{item}}"
      subnet_id: "{{vpc_sunet_id}}"
      instance_type: "t3.micro"
      sg_id: "{{sg_id}}"
      image_id: "{{image_id}}"
    loop: "{{instances}}"
    register: "{{ec2-instances}}"
    
  - name: print the output
    ansible.builtin.debug:
      msg: "{{ec2-instances}}"
