- name: install and run nginx
  hosts: web
  become: yes 
  tasks:
  - name: install nginx
    ansible.builtin.dnf:
      name: nginx
      state: latest  
  - name: start nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes



# equal to -b in ad-hoc commands, getting the root access


